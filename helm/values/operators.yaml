# Operator-managed infrastructure (Dragonfly = Redis, used as both Celery
# broker/result backend and Django cache) and the env wiring that points the
# app at the in-cluster service. Applied as an overlay (see ../tests.yaml) and
# at deploy time alongside the environment values files.
app:
  # Dict form (keyed by env-var name); values are k8s env specs minus name.
  # Checkout the resources defined by extraManifests
  extraEnvVars:
    CELERY_REDIS_URL: { value: redis://ercs-dragonfly:6379/0 }
    CACHE_REDIS_URL: { value: redis://ercs-dragonfly:6379/1 }

  extraManifests:
    dragonflydb-cluster:
      apiVersion: dragonflydb.io/v1alpha1
      kind: Dragonfly
      metadata:
        labels:
          app.kubernetes.io/name: dragonfly
        name: ercs-dragonfly  # NOTE: this will be the service name
      spec:
        replicas: 1
        args: ["--dbfilename=mainSnapshot"]  # NOTE: Only maintains 1 last snapshot
        resources:
          requests:
            cpu: "0.1"
            memory: 500Mi
          limits:
            cpu: "1"
            memory: 750Mi
        snapshot:
          cron: "*/5 * * * *"
          persistentVolumeClaimSpec:
            # storageClassName:
            accessModes:
            - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
