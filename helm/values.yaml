app:
  environment: PROD
  # Global Image
  appTypeEnvName: "APP_TYPE"
  image:
    name: SET-BY-CICD-IMAGE
    tag: SET-BY-CICD-TAG
    imagePullPolicy: IfNotPresent

  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "20m"

  redis:
    enabled: false


  postgresql:
    enabled: true
    fullnameOverride: "ercs-postgresql"
    architecture: standalone
    auth:
      postgresPassword: ""
      username: ""
      password: ""
      database: "ercs"
    primary:
      persistence:
        enabled: "true"
        storageClass: ""
        size: 1Gi

  minio:
    enabled: false
    disableWebUI: true
    mode: standalone
    fullnameOverride: ercs-minio
    global:
      defaultStorageClass:
    apiIngress:
      enabled: true
      ingressClassName:
      hostname:
      annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    auth:
      forceNewKeys: true
      rootUser: ercs
      rootPassword:
    persistence:
      enabled: true
      size: 1Gi
    defaultBuckets: ercs-static,ercs-media
    provisioning:
      enabled: true
      resourcesPreset: "nano"
      cleanupAfterFinished:
        enabled: true
      extraCommands:
        - "mc anonymous set download provisioning/ercs-static"
        - "mc anonymous set download provisioning/ercs-media"

  api:
    enabled: true
    replicaCount: 1
    containerPort: 80
    command: ["misc/prod/run_web.sh"]
    resources:
      requests:
        cpu: "0.3"
        memory: 0.4Gi
      limits:
        cpu: "0.5"
        memory: 1Gi

  worker:
    enabled: false
    beat:
      enabled: false
      command: ["celery", "-A", "main", "beat", "-l", "INFO"]
      resources:
        requests:
          cpu: "0.1"
          memory: 0.5Gi
        limits:
          cpu: "1"
          memory: 1Gi
    queueCommandPrefix:
      - "celery"
      - "-A"
      - "main"
      - "worker"
      - "-l"
      - "INFO"
    queues:
      default:
        enabled: true
        replicaCount: 1
        celeryArgs:
          - "-Q"
          - "default"
          - "--concurrency"
          - "4"
          - "--max-tasks-per-child"
          - "10"

  argoHook:
    enabled: true
    resources:
      requests:
        cpu: "0.1"
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 2Gi
    hooks:
      db-migrate:
        enabled: true
        hook: PostSync
        preserveHistory: true
        command: ["/bin/bash", "-c", "./manage.py wait_for_resources --db && ./manage.py migrate"]
      collect-static:
        enabled: true
        hook: PostSync
        command: ["/bin/bash", "-c", "./manage.py wait_for_resources --minio && ./manage.py collectstatic --noinput"]


  env:
    APP_RELEASE: "{{ $.Values.image.tag }}"
    APP_ENVIRONMENT: "{{ $.Values.environment }}"
    DJANGO_DEBUG: "false"
    # AWS
    AWS_S3_ENABLED: "false"
    AWS_S3_ENDPOINT_URL: "https://{{ $.Values.minio.apiIngress.hostname }}/"
    AWS_S3_MEDIA_BUCKET_NAME: "ercs-media"
    AWS_S3_STATIC_BUCKET_NAME: "ercs-static"
    # App Domain
    APP_TYPE: "WEB"
    APP_DOMAIN: "{{ required \".app.env.APP_DOMAIN\" nil }}"
    FRONTEND_DOMAIN: "{{ required \".app.env.FRONTEND_DOMAIN\" nil }}"
    SESSION_COOKIE_DOMAIN: "{{ required \".app.env.SESSION_COOKIE_DOMAIN\" nil }}"
    CSRF_COOKIE_DOMAIN: "{{ required \".app.env.CSRF_COOKIE_DOMAIN\" nil }}"

  secrets:
    DJANGO_SECRET_KEY: "{{ required \".Values.secrets.DJANGO_SECRET_KEY\" nil }}"
    # Postgres
    POSTGRES_DB: "{{ $.Values.postgresql.auth.database }}"
    POSTGRES_USER: "postgres"
    POSTGRES_PASSWORD: "{{ $.Values.postgresql.auth.postgresPassword }}"
    POSTGRES_HOST: "{{ include \"postgresql.v1.primary.fullname\" $.Subcharts.postgresql }}"
    POSTGRES_PORT: "{{ include \"postgresql.v1.service.port\" $.Subcharts.postgresql }}"
    # Minio (S3)
    AWS_S3_ACCESS_KEY_ID: "{{ required \".app.minio.auth.rootUser\" $.Values.minio.auth.rootUser }}"
    AWS_S3_SECRET_ACCESS_KEY: "{{ required \".app.minio.auth.rootPassword\" $.Values.minio.auth.rootPassword }}"
    AWS_S3_REGION_NAME: "us-east-1"
    AWS_S3_MEDIA_BUCKET_NAME: "ercs-media"
    AWS_S3_STATIC_BUCKET_NAME: "ercs-static"
    # Redis
    CELERY_REDIS_URL: "redis://{{ printf \"%s-master\" (include \"common.names.fullname\" $.Subcharts.redis) }}:6379/0"
    CACHE_REDIS_URL: "redis://{{ printf \"%s-master\" (include \"common.names.fullname\" $.Subcharts.redis) }}:6379/1"
