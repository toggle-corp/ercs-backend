app:
  environment: PROD
  # Global Image
  image:
    name: SET-BY-CICD-IMAGE
    tag: SET-BY-CICD-TAG
    imagePullPolicy: IfNotPresent

  ingress:
    enabled: true
    className:
    host:

  postgresql:
    enabled: false
    fullnameOverride: "ercs-pg"
    architecture: standalone
    auth:
      postgresPassword: ""
      username: ""
      password: ""
      database: ""
    primary:
      persistence:
        enabled: true
        storageClass: ""
        size: 8Gi

  # https://artifacthub.io/packages/helm/bitnami/minio
  minio:
    enabled: false
    disableWebUI: true
    mode: standalone
    fullnameOverride: ercs-minio
    global:
      defaultStorageClass:
    apiIngress:
      enabled: true
      ingressClassName:
      hostname:
      annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    auth:
      forceNewKeys: True
      rootUser: ercs
      rootPassword:
    persistence:
      enabled: true
      size: 10Gi
    defaultBuckets: ercs-static,ercs-media  # XXX: Don't change this
    provisioning:
      enabled: true
      resourcesPreset: "nano"
      cleanupAfterFinished:
        enabled: true
      extraCommands:
        - "mc anonymous set download provisioning/ercs-static"

  api:
    enabled: true
    replicaCount: 1
    containerPort: 80
    command: ["/code/scripts/deploy/run_web.sh"]
    resources:
      requests:
        cpu: "1"
        memory: 0.5Gi
      limits:
        cpu: "2"
        memory: 1Gi

  worker:
    enabled: false

  argoHook:
    enabled: true
    resources:
      requests:
        cpu: "0.1"
        memory: 0.5Gi
      limits:
        cpu: "2"
        memory: 1Gi
    hooks:
      # NOTE: Make sure keys are lowercase
      db-migrate:
        enabled: true
        hook: PostSync
        preserveHistory: true
        command: ["/bin/bash", "-c"]
        args:
          - "./manage.py wait_for_resources --db && ./manage.py migrate"

  cronjobs:
    enabled: false

  # NOTE: Check main/settings.py for all available options
  env:
    APP_RELEASE: "{{ $.Values.image.tag }}"
    APP_ENVIRONMENT: "{{ $.Values.environment }}"
    DJANGO_DEBUG: "false"
    # App Domain
    APP_DOMAIN: "{{ required \".app.env.APP_DOMAIN\" nil }}"
    # -- AWS
    AWS_S3_ENABLED: "false"
    # AWS_S3_ENDPOINT_URL:
    # AWS_S3_MEDIA_BUCKET_NAME:
    # AWS_S3_STATIC_BUCKET_NAME:

  # NOTE: Check main/settings.py for all available options
  secrets: {}
    # DJANGO_SECRET_KEY: "{{ required \".app.secrets.DJANGO_SECRET_KEY\" nil }}"
    # -- Postgres
    # POSTGRES_DB:
    # POSTGRES_USER:
    # POSTGRES_PASSWORD:
    # POSTGRES_HOST:
    # POSTGRES_PORT:
    # -- S3
    # AWS_S3_ACCESS_KEY_ID:
    # AWS_S3_SECRET_ACCESS_KEY:
    # AWS_S3_REGION_NAME:
