app:
  environment: PROD
  nameOverride: ercs

  appTypeEnvName: "APP_TYPE"

  # Global Image
  image:
    name: SET-BY-CICD-IMAGE
    tag: SET-BY-CICD-TAG
    imagePullPolicy: IfNotPresent

  # NOTE: DB/cache/broker are supplied externally (operator CRs in
  # ./values/operators.yaml + user secrets); the old bundled
  # postgresql/redis/minio subcharts are gone in banjo-helm 0.4.

  api:
    enabled: true
    containerPort: 80
    command: ["misc/prod/run_web.sh"]
    ingress:
      enabled: true
      className: nginx
      host:
      annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    probes:
      # banjo-utils HealthProbeMiddleware serves /healthz/live/ and /healthz/ready/.
      # Chart defaults (liveness /healthz/live/, readiness+startup /healthz/ready/) apply.
      enabled: true
    resources:
      requests:
        cpu: "0.3"
        memory: 0.4Gi
      limits:
        memory: 1Gi

  worker:
    enabled: true
    queueDefaults:
      commandPrefix:
        - "celery"
        - "-A"
        - "main"
        - "worker"
        - "-l"
        - "INFO"
      # banjo-celery-probe heartbeat wiring (writer via setup_worker_heartbeat,
      # reader via banjo-celery-probe) on a RAM emptyDir.
      extraEnv:
        BANJO_CELERY_HEARTBEAT_FILE: /var/run/celery/worker_heartbeat
      volumes:
        celery-heartbeat: {emptyDir: {medium: Memory, sizeLimit: 1Mi}}
      volumeMounts:
        celery-heartbeat: {mountPath: /var/run/celery}
      probes:
        enabled: true
        liveness:
          exec: {command: [banjo-celery-probe]}
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 6
        startup:
          exec: {command: [banjo-celery-probe]}
          periodSeconds: 5
          failureThreshold: 30
      resources:
        requests:
          cpu: "0.1"
          memory: 0.5Gi
        limits:
          memory: 1Gi
    queues:
      # NOTE: Make sure keys are lowercase
      default:
        enabled: true
        celeryArgs:
          - "-Q"
          - "default"
          - "--concurrency"
          - "1"
          - "--max-tasks-per-child"
          - "10"
    addons:
      beat:
        enabled: true
        replicaCount: 1
        strategy: {type: Recreate}
        # HeartbeatPersistentScheduler: plain celery beat (no django-celery-beat)
        # that touches the beat heartbeat file each tick for banjo-celery-probe liveness.
        command:
          - "celery"
          - "-A"
          - "main"
          - "beat"
          - "-l"
          - "INFO"
          - "--scheduler"
          - "banjo_utils.celery_health.persistent.HeartbeatPersistentScheduler"
        extraEnv:
          BANJO_CELERY_HEARTBEAT_FILE: /var/run/celery/beat_heartbeat
        volumes:
          celery-heartbeat: {emptyDir: {medium: Memory, sizeLimit: 1Mi}}
        volumeMounts:
          celery-heartbeat: {mountPath: /var/run/celery}
        probes:
          enabled: true
          liveness:
            # PersistentScheduler max_interval is 300s, so keep --max-age above it.
            exec: {command: [banjo-celery-probe, --max-age, "360"]}
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
        resources:
          requests:
            cpu: "0.1"
            memory: 256Mi
          limits:
            memory: 512Mi

  hooks:
    enabled: true
    defaults:
      resources:
        requests:
          cpu: "0.1"
          memory: 1Gi
        limits:
          memory: 2Gi
    jobs:
      # db-migrate and collect-static inherit the chart defaults verbatim
      # (Sync hook @ wave 20). Only wait-for-resources overrides the bare command.
      wait-for-resources:
        command: ["./manage.py", "wait_for_resources", "--db", "--cache", "--celery-broker"]

  cronjobs:
    enabled: false

  # NOTE: Check main/settings.py for all available options
  env:
    APP_RELEASE: "{{ $.Values.image.tag }}"
    APP_ENVIRONMENT: "{{ $.Values.environment }}"
    DEBUG: "false"
    TIME_ZONE: UTC
    # Storage (S3 disabled by default -> filesystem)
    AWS_S3_ENABLED: "false"
    # App Domain
    APP_DOMAIN: "{{ required \".app.env.APP_DOMAIN\" nil }}"
    FRONTEND_DOMAIN: "{{ required \".app.env.FRONTEND_DOMAIN\" nil }}"
    SESSION_COOKIE_DOMAIN: "{{ required \".app.env.SESSION_COOKIE_DOMAIN\" nil }}"
    CSRF_COOKIE_DOMAIN: "{{ required \".app.env.CSRF_COOKIE_DOMAIN\" nil }}"
    # Sentry
    SENTRY_ENABLED: "false"

  # NOTE: Check main/settings.py for all available options
  secrets:
    DJANGO_SECRET_KEY: "{{ required \".app.secrets.DJANGO_SECRET_KEY\" nil }}"
    # Postgres
    POSTGRES_DB: "{{ required \".app.secrets.POSTGRES_DB\" nil }}"
    POSTGRES_USER: "{{ required \".app.secrets.POSTGRES_USER\" nil }}"
    POSTGRES_PASSWORD: "{{ required \".app.secrets.POSTGRES_PASSWORD\" nil }}"
    POSTGRES_HOST: "{{ required \".app.secrets.POSTGRES_HOST\" nil }}"
    POSTGRES_PORT: "{{ required \".app.secrets.POSTGRES_PORT\" nil }}"
    # - Celery / Cache (Redis)
    # CELERY_REDIS_URL / CACHE_REDIS_URL: Defined via extraEnvVars in ./values/operators.yaml

  # NOTE: Operator-managed infra (Dragonfly cache+broker) and the matching
  # extraEnvVars/extraManifests live in ./values/operators.yaml.
