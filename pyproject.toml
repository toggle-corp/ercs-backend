[project]
name = "ercs-backend"
version = "0.1.0"
description = "ERCS-EOC Backend"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.1",
    "psycopg2-binary>=2.9",
    "Pillow>=10.0",
    "django-environ>=0.11",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.3",
    "django-storages[s3]>=1.14",
    "strawberry-graphql-django~=0.70.1",
    "django-choices-field",
    "asgiref>=3.8",
    "gunicorn>=23.0",
    "uvicorn>=0.34",
    "django-stubs-ext>=5.0",
]

[dependency-groups]
dev = [
    "pytest-django>=4.9",
    "django-debug-toolbar>=4.3",
    "django-stubs>=5.0",
    "ipython>=8.0",
    "factory-boy>=3.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "main.settings"
log_cli = true

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "main.settings"
